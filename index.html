<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨雲予測レーダー（24時間）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#0f1720; --panel:rgba(17,24,33,.92); --fg:#e8eef5; --muted:#93a3b5; --accent:#4cc3ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  #map { position:absolute; inset:0; }
  .top { position:absolute; top:10px; left:10px; right:10px; z-index:1000; display:flex; gap:8px; flex-wrap:wrap; align-items:center; pointer-events:none; }
  .top > * { pointer-events:auto; }
  select, button { background:var(--panel); color:var(--fg); border:1px solid #2a3949; border-radius:10px;
    padding:8px 12px; font-size:14px; font-family:inherit; }
  button { cursor:pointer; }
  button.on { border-color:var(--accent); color:var(--accent); }
  #status { background:var(--panel); border-radius:10px; padding:6px 10px; font-size:12px; color:var(--muted); }
  .bottom { position:absolute; left:10px; right:10px; bottom:14px; z-index:1000; background:var(--panel);
    border-radius:14px; padding:12px 14px; border:1px solid #2a3949; }
  .row { display:flex; align-items:center; gap:10px; }
  #play { width:44px; height:44px; padding:0; font-size:18px; border-radius:50%; flex:none; }
  #time { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  #rel { color:var(--muted); font-size:13px; }
  #here { margin-left:auto; text-align:right; font-size:13px; color:var(--muted); }
  #here b { color:var(--fg); font-size:16px; }
  input[type=range] { width:100%; margin:10px 0 2px; accent-color:var(--accent); }
  #bars { display:flex; align-items:flex-end; gap:2px; height:38px; margin-top:6px; }
  #bars div { flex:1; background:#2a3949; border-radius:2px 2px 0 0; min-height:2px; cursor:pointer; position:relative; }
  #bars div.cur { outline:1.5px solid var(--accent); }
  .ticks { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:3px; }
  .legend { display:flex; gap:0; margin-top:8px; font-size:10px; color:var(--muted); align-items:center; flex-wrap:wrap; }
  .legend span.sw { display:inline-block; width:14px; height:10px; margin:0 3px 0 6px; border-radius:2px; vertical-align:middle; }
  .note { font-size:10px; color:var(--muted); margin-top:6px; }
  .note a { color:var(--muted); }
  .leaflet-control-attribution { font-size:9px; }
  /* OSM標準地図をダーク調に変換（雨雲の色はそのまま） */
  .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.6); }
  .leaflet-container { background:#1b2129; }
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <select id="city" aria-label="地点">
    <option value="35.6812,139.7671" selected>東京</option>
    <option value="35.4437,139.6380">横浜</option>
    <option value="35.8617,139.6455">さいたま</option>
    <option value="35.6074,140.1065">千葉</option>
    <option value="43.0618,141.3545">札幌</option>
    <option value="38.2682,140.8694">仙台</option>
    <option value="37.9162,139.0364">新潟</option>
    <option value="35.1815,136.9066">名古屋</option>
    <option value="35.0116,135.7681">京都</option>
    <option value="34.6937,135.5023">大阪</option>
    <option value="34.6901,135.1955">神戸</option>
    <option value="34.3853,132.4553">広島</option>
    <option value="33.5904,130.4017">福岡</option>
    <option value="31.5966,130.5571">鹿児島</option>
    <option value="26.2124,127.6809">那覇</option>
    <option value="gps">📍 現在地</option>
  </select>
  <button id="radarBtn" title="気象レーダーの実況（直近）を重ねる">実況レーダー</button>
  <span id="status">読み込み中…</span>
</div>

<div class="bottom">
  <div class="row">
    <button id="play" aria-label="再生">▶</button>
    <div>
      <div id="time">--:--</div>
      <div id="rel">現在</div>
    </div>
    <div id="here"><span id="placeName">東京</span><br><b id="hereVal">-</b></div>
  </div>
  <input id="slider" type="range" min="0" max="24" step="1" value="0" aria-label="予測時刻">
  <div id="bars"></div>
  <div class="ticks"><span>今</span><span>+6h</span><span>+12h</span><span>+18h</span><span>+24h</span></div>
  <div class="legend" id="legend"></div>
  <div class="note">予報: 気象庁モデル（MSM/GSM）via <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>。表示範囲を格子状に取得して補間した1時間降水量です。実況: <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a></div>
</div>

<script>
// ---------- 色スケール（気象庁の降水強度に準拠） ----------
const SCALE = [
  [0.1, [242,242,255,  80]],
  [1,   [160,210,255, 170]],
  [5,   [ 33,140,255, 200]],
  [10,  [  0, 65,255, 210]],
  [20,  [250,245,  0, 220]],
  [30,  [255,153,  0, 225]],
  [50,  [255, 40,  0, 230]],
  [80,  [180,  0,104, 235]],
];
function colorFor(v){
  if (v < SCALE[0][0]) return null;
  let c = SCALE[0][1];
  for (const [th,col] of SCALE) if (v >= th) c = col;
  return c;
}
(function legend(){
  const el = document.getElementById('legend');
  el.innerHTML = 'mm/h' + SCALE.map(([th,c]) =>
    `<span class="sw" style="background:rgba(${c[0]},${c[1]},${c[2]},${c[3]/255})"></span>${th}`).join('');
})();

// ---------- 地図 ----------
const map = L.map('map', { zoomControl:false, attributionControl:true }).setView([35.6812,139.7671], 8);
L.control.zoom({ position:'topright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, className: 'dark-tiles',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
const pane = map.createPane('rain'); pane.style.zIndex = 450; pane.style.pointerEvents = 'none';
let marker = L.circleMarker([35.6812,139.7671], { radius:7, color:'#fff', weight:2, fillColor:'#4cc3ff', fillOpacity:1 }).addTo(map);

// ---------- 状態 ----------
const N = 11;                 // 格子数（N×N 地点）
const HOURS = 25;             // 0〜24時間後
let grid = null;              // { lats, lons, times, vals[h][i][j] }
let hour = 0, overlay = null, playing = null;
let point = { lat:35.6812, lon:139.7671, name:'東京', series:null };
const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;

function fmtTime(iso){ const d = new Date(iso); return d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}); }

async function fetchPoints(lats, lons){
  const url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + lats.map(v=>v.toFixed(3)).join(',')
    + '&longitude=' + lons.map(v=>v.toFixed(3)).join(',')
    + '&hourly=precipitation&models=jma_seamless&forecast_hours=' + HOURS
    + '&timezone=Asia%2FTokyo';
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return Array.isArray(j) ? j : [j];
}

// 表示範囲の格子データを取得
let reqId = 0;
async function loadGrid(){
  const id = ++reqId;
  const b = map.getBounds().pad(0.1);
  const s = Math.max(b.getSouth(), 20), n = Math.min(b.getNorth(), 50);
  const w = Math.max(b.getWest(), 118), e = Math.min(b.getEast(), 155);
  if (s >= n || w >= e) { status('日本周辺のみ対応しています'); return; }
  const lats = [], lons = [];
  for (let i=0;i<N;i++) lats.push(n - (n-s)*i/(N-1));   // 北→南
  for (let j=0;j<N;j++) lons.push(w + (e-w)*j/(N-1));   // 西→東
  const qLat = [], qLon = [];
  for (const la of lats) for (const lo of lons) { qLat.push(la); qLon.push(lo); }
  status('予報を取得中…');
  try {
    const res = await fetchPoints(qLat, qLon);
    if (id !== reqId) return;
    const times = res[0].hourly.time;
    const vals = [];
    for (let h=0; h<times.length; h++){
      const m = [];
      for (let i=0;i<N;i++){ const row=[]; for (let j=0;j<N;j++){ const v = res[i*N+j].hourly.precipitation[h]; row.push(v==null?0:v);} m.push(row); }
      vals.push(m);
    }
    grid = { lats, lons, times, vals, s, n, w, e };
    $('slider').max = times.length - 1;
    status('更新 ' + new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}));
    draw();
  } catch(err){
    if (id === reqId) status('取得に失敗しました（' + err.message + '）');
  }
}

// 双線形補間で画像化して重ねる
function draw(){
  if (!grid) return;
  const W = 220, H = 220;
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx = cv.getContext('2d'); const img = ctx.createImageData(W,H);
  const m = grid.vals[hour];
  for (let y=0;y<H;y++){
    const fy = y/(H-1)*(N-1), i0 = Math.min(Math.floor(fy), N-2), ty = fy-i0;
    for (let x=0;x<W;x++){
      const fx = x/(W-1)*(N-1), j0 = Math.min(Math.floor(fx), N-2), tx = fx-j0;
      const v = (m[i0][j0]*(1-tx)+m[i0][j0+1]*tx)*(1-ty) + (m[i0+1][j0]*(1-tx)+m[i0+1][j0+1]*tx)*ty;
      const c = colorFor(v); const k=(y*W+x)*4;
      if (c){ img.data[k]=c[0]; img.data[k+1]=c[1]; img.data[k+2]=c[2]; img.data[k+3]=c[3]; }
    }
  }
  ctx.putImageData(img,0,0);
  const bounds = [[grid.s, grid.w],[grid.n, grid.e]];
  const url = cv.toDataURL();
  if (overlay){ overlay.setUrl(url); overlay.setBounds(L.latLngBounds(bounds)); }
  else overlay = L.imageOverlay(url, bounds, { pane:'rain', opacity:0.85 }).addTo(map);
  $('time').textContent = fmtTime(grid.times[hour]);
  $('rel').textContent = hour === 0 ? '現在' : `${hour}時間後`;
  updateHere();
}

// 選択地点の24時間推移
async function loadPoint(){
  try {
    const [r] = await fetchPoints([point.lat],[point.lon]);
    point.series = r.hourly.precipitation.map(v=>v==null?0:v);
    renderBars(); updateHere();
  } catch(e){ /* 格子取得側でエラー表示 */ }
}
function renderBars(){
  const el = $('bars'); el.innerHTML = '';
  if (!point.series) return;
  const mx = Math.max(5, ...point.series);
  point.series.forEach((v,h) => {
    const d = document.createElement('div');
    d.style.height = Math.max(2, v/mx*38) + 'px';
    const c = colorFor(v); if (c) d.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
    d.title = `${h}時間後: ${v.toFixed(1)} mm/h`;
    if (h === hour) d.className = 'cur';
    d.onclick = () => setHour(h);
    el.appendChild(d);
  });
}
function updateHere(){
  $('placeName').textContent = point.name;
  if (!point.series) { $('hereVal').textContent='-'; return; }
  const v = point.series[hour] ?? 0;
  $('hereVal').textContent = v < 0.1 ? '降水なし' : v.toFixed(1) + ' mm/h';
  [...$('bars').children].forEach((d,h)=>d.className = h===hour?'cur':'');
}
function setHour(h){ hour = h; $('slider').value = h; draw(); }

function setPoint(lat, lon, name, zoom){
  point = { lat, lon, name, series:null };
  marker.setLatLng([lat,lon]);
  map.setView([lat,lon], zoom ?? map.getZoom());
  loadPoint();
}

// ---------- 操作 ----------
$('slider').oninput = e => setHour(+e.target.value);
$('play').onclick = () => {
  if (playing){ clearInterval(playing); playing=null; $('play').textContent='▶'; return; }
  $('play').textContent='❚❚';
  playing = setInterval(()=> setHour(hour >= +$('slider').max ? 0 : hour+1), 700);
};
$('city').onchange = e => {
  const v = e.target.value;
  if (v === 'gps'){
    if (!navigator.geolocation){ status('現在地を取得できません'); return; }
    status('現在地を取得中…');
    navigator.geolocation.getCurrentPosition(
      p => setPoint(p.coords.latitude, p.coords.longitude, '現在地', 9),
      () => status('現在地の許可がありません'), { timeout:10000 });
  } else {
    const [la,lo] = v.split(',').map(Number);
    setPoint(la, lo, e.target.selectedOptions[0].text, 8);
  }
};
map.on('click', e => setPoint(e.latlng.lat, e.latlng.lng, `${e.latlng.lat.toFixed(2)}, ${e.latlng.lng.toFixed(2)}`));
let t; map.on('moveend', () => { clearTimeout(t); t = setTimeout(loadGrid, 400); });
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight') setHour(Math.min(hour+1, +$('slider').max));
  if (e.key==='ArrowLeft') setHour(Math.max(hour-1, 0));
});

// 実況レーダー（RainViewer：直近の観測。予報とは別レイヤー）
let radarLayer = null;
$('radarBtn').onclick = async () => {
  const btn = $('radarBtn');
  if (radarLayer){ map.removeLayer(radarLayer); radarLayer=null; btn.classList.remove('on'); btn.textContent='実況レーダー'; return; }
  try {
    const j = await (await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();
    const f = j.radar.past[j.radar.past.length-1];
    radarLayer = L.tileLayer(`${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`, { opacity:0.7, maxNativeZoom:7, maxZoom:18, zIndex:500 }).addTo(map);
    btn.classList.add('on');
    btn.textContent = '実況 ' + new Date(f.time*1000).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  } catch(e){ status('実況レーダーを取得できません'); }
};

loadGrid(); loadPoint();
</script>
</body>
</html>
